name = "pineconegp-contact"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = false

# Only /api/contact (and the 404 for /infra/*) is handled by the Worker; the rest of the site stays on GitHub Pages.
routes = [
  { pattern = "pineconegp.com/api/contact", zone_name = "pineconegp.com" },
  { pattern = "www.pineconegp.com/api/contact", zone_name = "pineconegp.com" },
  # Hide this source folder (infra/) from the public site: the worker answers 404 here.
  { pattern = "pineconegp.com/infra/*", zone_name = "pineconegp.com" },
  { pattern = "www.pineconegp.com/infra/*", zone_name = "pineconegp.com" },
]

# Cloudflare Email Routing send binding. destination_address locks it to one verified inbox.
[[send_email]]
name = "SEND_EMAIL"
destination_address = "admin@pineconegp.com"

[observability]
enabled = true
